name: Release

# Triggered when a maintainer pushes a vX.Y.Z tag to main.
# Creates an immutable GitHub Release with the corresponding CHANGELOG section.
#
# Release process:
#   0. Prerequisite, not optional: 0 open issues, 0 open PRs, 0 open
#      Dependabot/code-scanning/secret-scanning alerts, and no stale/
#      unnecessary branches on dev -- and README.md, other docs, and
#      inline code comments verified current against the actual code
#      (not just "a doc exists", check its specific claims). See
#      docs/adr/005-upstream-sync-strategy.md and the repo-hygiene-
#      and-docs standing rule. A release is not "ready" on green CI
#      alone if this is skipped.
#   1. Bump CHIRON_VERSION in src/constants.py on dev.
#   2. Move [Unreleased] → [X.Y.Z] in CHANGELOG.md on dev.
#   3. Open a PR from dev → main; wait for CI (ci-security.yml) to pass.
#   4. Merge the PR.
#   5. On main: git tag -a vX.Y.Z -m "Chiron vX.Y.Z"
#   6. git push origin vX.Y.Z  ← triggers this workflow.
#
# Prereleases (alpha/beta/rc): see docs/adr/006-release-channel-strategy.md.
# Same steps above, minus step 2 (no CHANGELOG section needed) and tagging
# vX.Y.Z-alpha.N / -beta.N / -rc.N instead of the final vX.Y.Z at step 5 —
# this workflow marks those "Pre-release" automatically and pulls the
# generated notes from [Unreleased] instead of a version-specific section.

on:
  push:
    tags:
      - 'v[0-9]*'

# contents:write is required to create a GitHub Release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release in progress — partial releases are worse than slow ones.
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Parse tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Two independent reasons a tag is marked pre-release on GitHub (never
          # "latest", never bumps what a plain `git clone` on main implies):
          #   - a version starting with 0. (pre-1.0 — the whole project is still
          #     pre-release by SemVer's own definition)
          #   - a SemVer prerelease suffix (-alpha.N / -beta.N / -rc.N) — see
          #     docs/adr/006-release-channel-strategy.md. Maturity is signaled by
          #     tagging one branch (main), not by maintaining separate long-lived
          #     alpha/beta/rc branches.
          if [[ "${VERSION}" == 0.* ]] || [[ "${VERSION}" =~ -(alpha|beta|rc)(\.[0-9]+)?$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        id: notes
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, os

          content = pathlib.Path("CHANGELOG.md").read_text()
          version = os.environ["VERSION"]
          is_prerelease_tag = bool(re.search(r"-(alpha|beta|rc)(\.[0-9]+)?$", version))

          def section(heading: str) -> str | None:
              # Match from "## [HEADING]..." to the next "## " heading (exclusive).
              pattern = rf'## \[{re.escape(heading)}\][^\n]*\n(.*?)(?=\n## |\Z)'
              m = re.search(pattern, content, re.DOTALL)
              return m.group(1).strip() if m else None

          # 1. An exact "## [X.Y.Z]" section always wins if present -- this is
          #    what a final release (X.Y.Z with no prerelease suffix) is
          #    expected to have, per the documented release process.
          notes = section(version)

          # 2. A prerelease tag (alpha/beta/rc) is cut ad hoc from whatever's
          #    currently on dev/main, per ADR 006 -- it is not expected to have
          #    its own CHANGELOG section (that would mean rewriting CHANGELOG.md
          #    on every alpha/beta bump for content that all rolls into the
          #    same eventual final-version entry). Show what's accumulated in
          #    [Unreleased] instead, so the release notes are still genuinely
          #    informative rather than a placeholder.
          if notes is None and is_prerelease_tag:
              unreleased = section("Unreleased")
              if unreleased:
                  notes = (
                      f"Prerelease build ({version}). Changes accumulated so far "
                      f"toward the next version (not yet a final CHANGELOG entry):\n\n"
                      f"{unreleased}"
                  )

          # 3. Nothing found either way -- generic fallback so the release still
          #    gets created with *something*, rather than failing the workflow.
          if notes is None:
              notes = (
                  f"Release v{version} of Chiron — the security overlay fork of Odysseus.\n\n"
                  f"See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) "
                  f"for full details."
              )

          pathlib.Path("/tmp/release_notes.txt").write_text(notes)
          print(f"Extracted {len(notes)} characters of release notes for v{version}")
          PYEOF
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Verify CHANGELOG section found
        run: |
          if [ ! -s /tmp/release_notes.txt ]; then
            echo "::error::release_notes.txt is empty — check that CHANGELOG.md has a [$(cat /tmp/release_notes.txt)] section"
            exit 1
          fi
          echo "Release notes preview (first 20 lines):"
          head -20 /tmp/release_notes.txt

      - name: Create GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.TAG;
            const version = process.env.VERSION;
            const isPrerelease = process.env.PRERELEASE === 'true';
            const notes = fs.readFileSync('/tmp/release_notes.txt', 'utf8');

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Chiron ${tag}`,
              body: [
                notes,
                '',
                '---',
                '',
                '> **Authorization requirement:** All active tools require explicit written',
                '> authorization for any target. See [SECURITY.md](SECURITY.md).',
                '',
                `**Upstream base:** Odysseus \`1.0.3\`  `,
                `**Full Changelog:** https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md`,
              ].join('\n'),
              draft: false,
              prerelease: isPrerelease,
              make_latest: !isPrerelease ? 'true' : 'false',
            });

            core.info(`Release created: ${release.html_url}`);
            core.setOutput('release_url', release.html_url);
