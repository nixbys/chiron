# Overlay this on top of the base docker-compose.yml:
#   podman-compose -f docker-compose.yml -f docker-compose.security.yml --profile sidecars up -d --build
#
# Services added:
#   ollama      — local LLM runtime (AMD ROCm / RX 6950 XT); API at http://localhost:11434
#   toolchain   — Kali sidecar exposing an internal exec API on :8088 (never published
#                 to the host — arbitrary command execution surface, internal-network only)
#   spiderfoot  — SpiderFoot OSINT server; web UI + REST API at http://localhost:5001
#   bentopdf    — BentoPDF client-side PDF toolkit; web UI at http://localhost:3000
#   opensearch  — findings persistence index; REST API (no bundled Dashboards UI) at
#                 http://localhost:9200
#
# spiderfoot/bentopdf/opensearch/ollama are all published on 127.0.0.1 only (never
# 0.0.0.0 -- keep it that way for any network-exposed deployment) so the Security
# Hub's Connected Services panel (static/security.html) can link straight to them.
#
# toolchain, spiderfoot, bentopdf, and opensearch are each gated behind
# TWO Compose profiles: the shared "sidecars" group (for
# `--profile sidecars`, unchanged — starts all four, same as always) AND
# their own individual profile name ("toolchain", "spiderfoot",
# "bentopdf", "opensearch"). This lets you skip just ONE of the four
# instead of all-or-nothing: if you already have the underlying tool/
# service installed on this machine (e.g. nmap on PATH, a native
# SpiderFoot/OpenSearch install), pass only the profiles you still want,
# e.g. `--profile toolchain --profile bentopdf --profile opensearch` to
# start everything except SpiderFoot, and point the corresponding env var
# (ODYSSEUS_TOOLCHAIN_API, SPIDERFOOT_URL, BENTOPDF_URL, OPENSEARCH_URL) at
# your local instance instead — see docs/setup.md "Hybrid / local-tools
# mode", `src/host_capabilities.py` (setup.py runs this scan and offers to
# set the right env vars automatically), and TOOLCHAIN_EXEC_MODE /
# TOOLCHAIN_EXEC_MODE_<BINARY> for per-tool control over the toolchain
# binaries specifically. Ollama is not gated here since the comment below
# already documents redirecting it to a host instance.

services:
  # ── extend upstream odysseus with security + LLM env vars ────────────────
  odysseus:
    environment:
      # Ollama inside the compose stack
      OLLAMA_BASE_URL: "http://odysseus-ollama:11434/v1"
      LLM_HOST: "odysseus-ollama"
      # Toolchain exec API — MCP servers call this instead of podman exec
      ODYSSEUS_TOOLCHAIN_API: "http://odysseus-toolchain:8088"
      # Shared bearer token for exec API auth (must match toolchain service below)
      EXEC_API_TOKEN: "${EXEC_API_TOKEN:-}"
      # Threat intelligence API keys (fill in .env)
      SHODAN_API_KEY: "${SHODAN_API_KEY:-}"
      VIRUSTOTAL_API_KEY: "${VIRUSTOTAL_API_KEY:-}"
      OTX_API_KEY: "${OTX_API_KEY:-}"
      NVD_API_KEY: "${NVD_API_KEY:-}"
      # Censys API credentials (https://search.censys.io/account/api)
      CENSYS_API_ID: "${CENSYS_API_ID:-}"
      CENSYS_API_SECRET: "${CENSYS_API_SECRET:-}"
      # SpiderFoot REST endpoint
      SPIDERFOOT_URL: "${SPIDERFOOT_URL:-http://odysseus-spiderfoot:5001}"
      SPIDERFOOT_USERNAME: "${SPIDERFOOT_USERNAME:-}"
      SPIDERFOOT_PASSWORD: "${SPIDERFOOT_PASSWORD:-}"
      # PDF / BentoPDF
      BENTOPDF_URL: "${BENTOPDF_URL:-http://localhost:3000}"
      ODYSSEUS_DATA_DIR: "${ODYSSEUS_DATA_DIR:-./data}"
      # OpenSearch findings persistence
      OPENSEARCH_URL: "${OPENSEARCH_URL:-http://odysseus-opensearch:9200}"
      OPENSEARCH_USER: "${OPENSEARCH_USER:-admin}"
      OPENSEARCH_PASSWORD: "${OPENSEARCH_PASSWORD:-admin}"

  # ── Ollama local LLM runtime ──────────────────────────────────────────────
  ollama:
    # CPU image — works reliably in a container on a desktop system.
    #
    # GPU note (RX 6950 XT / Navi 21): ROCm in an isolated container fails
    # with "Memory in use" because the Wayland compositor holds GPU VA ranges
    # that ROCm's page-table walk treats as already mapped. GPU inference
    # requires running Ollama directly on the host (or inside a toolbox with
    # host namespaces). To use the host Ollama GPU instance instead, stop this
    # service and set OLLAMA_BASE_URL=http://host.docker.internal:11434/v1 in
    # the odysseus service above.
    image: docker.io/ollama/ollama:latest
    container_name: odysseus-ollama
    hostname: odysseus-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    security_opt:
      - no-new-privileges:true

  # ── Kali sidecar ──────────────────────────────────────────────────────────
  toolchain:
    profiles: ["sidecars", "toolchain"]
    build:
      context: ./docker/toolchain
      dockerfile: Dockerfile
    container_name: odysseus-toolchain
    hostname: odysseus-toolchain
    volumes:
      - toolchain-workspaces:/workspaces
      - toolchain-reports:/reports
    restart: unless-stopped
    environment:
      # Shared bearer token — set a strong random value in .env
      EXEC_API_TOKEN: "${EXEC_API_TOKEN:-}"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW      # required by nmap/masscan for raw socket scans
      - NET_ADMIN    # required for some network tooling
    security_opt:
      - no-new-privileges:true

  # ── SpiderFoot OSINT ──────────────────────────────────────────────────────
  spiderfoot:
    profiles: ["sidecars", "spiderfoot"]
    image: docker.io/fopina/spiderfoot:latest
    container_name: odysseus-spiderfoot
    hostname: odysseus-spiderfoot
    # Published on loopback only (matches bentopdf's own posture below) so the
    # Security Hub's Connected Services panel can link directly to the
    # SpiderFoot web UI. Still internal-network-only from anywhere but this
    # host -- never bind 0.0.0.0 here for a network-exposed deployment.
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - spiderfoot-data:/var/spiderfoot
    restart: unless-stopped
    environment:
      SHODAN_API_KEY: "${SHODAN_API_KEY:-}"
      VIRUSTOTAL_API_KEY: "${VIRUSTOTAL_API_KEY:-}"
      OTX_API_KEY: "${OTX_API_KEY:-}"
    security_opt:
      - no-new-privileges:true

  # ── BentoPDF ──────────────────────────────────────────────────────────────
  bentopdf:
    profiles: ["sidecars", "bentopdf"]
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: odysseus-bentopdf
    hostname: odysseus-bentopdf
    ports:
      - "127.0.0.1:3000:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ── OpenSearch — persistent findings index ────────────────────────────────
  opensearch:
    profiles: ["sidecars", "opensearch"]
    image: docker.io/opensearchproject/opensearch:2.17.0
    container_name: odysseus-opensearch
    hostname: odysseus-opensearch
    # Published on loopback only, same rationale as spiderfoot above -- this
    # is a REST API (no OpenSearch Dashboards service is bundled here), so
    # the Connected Services panel links to it for raw index/query access
    # rather than a browsable UI.
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_PASSWORD:-admin}"
      # Security plugin DISABLED by default -- matches findings_server.py's/
      # sigma_server.py's own OPENSEARCH_URL default (http://, no TLS). The
      # inverted default here used to say "false" (security ENABLED) while
      # this comment already said "disable for dev" -- with the plugin
      # actually enabled, OpenSearch 2.12+ demands port 9200 speak HTTPS with
      # a self-signed cert, which silently broke every plain-http:// caller
      # (findings_server, sigma_server, the Security Hub's Connected
      # Services probe) with no default value ever making it past OpenSearch's
      # own startup password validation to surface the mismatch. Set
      # OPENSEARCH_SECURITY_DISABLED=false (and switch OPENSEARCH_URL to
      # https://, and set a real OPENSEARCH_PASSWORD -- 8+ chars, upper+
      # lower+digit+special char, OpenSearch itself refuses to start
      # otherwise) for a production deployment that needs OpenSearch's own
      # auth on top of Chiron's.
      plugins.security.disabled: "${OPENSEARCH_SECURITY_DISABLED:-true}"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

volumes:
  ollama-models:
  toolchain-workspaces:
  toolchain-reports:
  spiderfoot-data:
  opensearch-data:
