repos:
  # Same version .github/workflows/secret-scan.yml pins for CI (keep these
  # two in sync) -- catches a secret before it's ever committed, not just
  # before it's merged. CI's own full-history scan stays the backstop for
  # anything that slips past a contributor who skipped pre-commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(mcp_servers/recon_server|mcp_servers/osint_server|mcp_servers/web_vuln_server|mcp_servers/intel_server|mcp_servers/hashcrack_server|mcp_servers/engagement_server|mcp_servers/monitor_server|mcp_servers/watchlist_server|mcp_servers/sigma_server|mcp_servers/host_telemetry_server|mcp_servers/compliance_server|mcp_servers/audit_server|mcp_servers/msf_server|modules/)

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^(mcp_servers/recon_server|mcp_servers/osint_server|mcp_servers/web_vuln_server|mcp_servers/intel_server|mcp_servers/hashcrack_server|mcp_servers/engagement_server|mcp_servers/monitor_server|mcp_servers/watchlist_server|mcp_servers/sigma_server|mcp_servers/host_telemetry_server|mcp_servers/compliance_server|mcp_servers/audit_server|mcp_servers/msf_server|modules/)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-ll, -r]
        files: ^(mcp_servers/recon_server|mcp_servers/osint_server|mcp_servers/web_vuln_server|mcp_servers/intel_server|mcp_servers/hashcrack_server|mcp_servers/engagement_server|mcp_servers/monitor_server|mcp_servers/watchlist_server|mcp_servers/sigma_server|mcp_servers/host_telemetry_server|mcp_servers/compliance_server|mcp_servers/audit_server|mcp_servers/msf_server|modules/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
      - id: end-of-file-fixer
        files: ^(mcp_servers/|modules/|skills/|docker/)
      - id: trailing-whitespace
        files: ^(mcp_servers/|modules/|skills/|docker/)
